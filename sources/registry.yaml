# Source registry: every outside source we take a skill, tool or resource from.
# Fields and words are defined in sources/README.md; tools/lint.py checks them. Baselines were
# read from the GitHub API on the date in `baseline.as_of`. Keep entries grouped by area, and
# quote commit ids so YAML never reads one as a number.

